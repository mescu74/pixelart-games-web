<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#16242a"><title>Cruce Porteño</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10191f;color:#f8e8c7;font-family:monospace}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#34464a,#10191f 77%)}#frame{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);overflow:hidden;background:#202e32;box-shadow:0 0 0 2px #d2ad70,0 16px 70px #000b}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}#touch{position:absolute;inset:auto 0 1%;display:none;justify-content:space-between;padding:0 2%;pointer-events:none}#touch>div{display:flex;gap:6px;pointer-events:auto}#touch button{width:clamp(40px,6vw,60px);height:clamp(40px,6vw,60px);border:2px solid #e0ba74;background:#182a31e8;color:#ffedc4;font:bold 19px monospace;border-radius:8px;touch-action:none;box-shadow:3px 3px #08131b}@media(pointer:coarse){#touch{display:flex}}@media(max-width:620px){#touch button{width:42px;height:42px}}
