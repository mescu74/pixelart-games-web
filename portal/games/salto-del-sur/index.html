<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101b29"><title>Lola y Pipo: Salto del Sur</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b29;color:#fff;font-family:monospace}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#233954,#0d1521 75%)}#frame{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);background:#172532;box-shadow:0 0 0 2px #446875,0 14px 70px #000b;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}#ui{position:absolute;inset:0;pointer-events:none;text-shadow:2px 2px #14202b}#hud{position:absolute;left:2.2%;top:3%;display:flex;align-items:center;gap:18px;font-size:clamp(10px,1.4vw,16px);font-weight:bold}#hud .panel{background:#122432db;border:2px solid #70bac0;padding:6px 10px;box-shadow:2px 2px #0b121a}#mates{color:#ffbd69}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#08131dbd;pointer-events:auto;text-align:center;padding:4vw}.card{max-width:600px;background:#152939;border:4px solid #74d7cd;padding:clamp(16px,4vw,40px);box-shadow:8px 8px #08131d}.card h1{color:#ffce78;font-size:clamp(20px,4vw,42px);margin:0 0 12px}.card p{font-size:clamp(11px,1.5vw,16px);line-height:1.65;color:#d6e8df}.card button{font: bold clamp(12px,1.5vw,17px) monospace;color:#12212a;background:#ffd076;border:0;padding:12px 24px;margin-top:8px;cursor:pointer;box-shadow:0 5px #b76644}.card button:active{transform:translateY(3px);box-shadow:0 2px #b76644}.small{font-size:clamp(9px,1vw,12px)!important;color:#97c9c3!important}.hidden{display:none!important}#touch{position:absolute;inset:auto 0 3% 0;display:none;justify-content:space-between;padding:0 3%;pointer-events:none}#touch button{pointer-events:auto;width:clamp(42px,7vw,68px);height:clamp(42px,7vw,68px);border:2px solid #b1e6d4;background:#173143c9;color:white;font:bold 22px monospace;border-radius:8px;touch-action:none}#touch .right{display:flex;gap:9px;align-items:end}@media(pointer:coarse){#touch{display:flex}}
</style></head><body><main id="frame"><canvas id="game" width="800" height="450" aria-label="Juego de plataformas pixel art"></canvas><section id="ui"><div id="hud"><span class="panel" id="mates">MATES ♥♥♥</span><span class="panel" id="score">PUNTOS 00000</span><span class="panel" id="mount">PIPO: LISTO</span></div><div id="overlay"><div class="card"><h1 id="title">LOLA Y PIPO<br>SALTO DEL SUR</h1><p id="message">Una aventura pixel art por las sierras del sur.<br>Salta, explora y despierta el Faro del Viento.</p><button id="start">COMENZAR AVENTURA</button><p class="small">MOVER: ← → / A D · SALTAR: ESPACIO · MONTAR: X · RÁFAGA: Z · PAUSA: P</p></div></div></section><div id="touch"><div class="right"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="right"><button data-key="gust">✦</button><button data-key="mount">X</button><button data-key="jump">▲</button></div></div></main><script src="game.js"></script></body></html>
