<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11242b"><title>Mudanza Porteña</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b23;color:#f5e8c9;font-family:monospace}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#314b50,#101820 75%)}#frame{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);overflow:hidden;background:#192c32;box-shadow:0 0 0 2px #bd9861,0 14px 70px #000b}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}#touch{position:absolute;inset:auto 0 2%;display:none;justify-content:space-between;padding:0 3%;pointer-events:none}#touch>div{display:flex;gap:8px;pointer-events:auto}#touch button{width:clamp(42px,7vw,66px);height:clamp(42px,7vw,66px);border:2px solid #e0bd78;background:#162c35e8;color:#ffedc4;font:bold 21px monospace;border-radius:8px;touch-action:none;box-shadow:3px 3px #08131b}@media(pointer:coarse){#touch{display:flex}}@media(max-width:620px){#touch{bottom:1%;padding:0 2%}#touch button{width:44px;height:44px}}
</style></head><body><main id="frame"><canvas id="game" width="960" height="540" aria-label="Mudanza Porteña, juego de bloques arcade"></canvas><div id="touch"><div><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="down">▼</button></div><div><button data-key="rotate">↻</button><button data-key="drop">⬇</button><button data-key="hold">H</button></div></div></main><script src="game.js"></script></body></html>
